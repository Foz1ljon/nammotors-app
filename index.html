<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0E5C97">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nammotors">
    <title>Nammotors — Sklad tizimi</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: radial-gradient(circle at 25% 15%, #16466c 0%, #0a2a43 50%, #061a2c 100%);
        transition: opacity 0.5s ease;
      }

      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }

      .splash-dotgrid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.5px, transparent 1.5px);
        background-size: 24px 24px;
        mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 70%);
        -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 70%);
      }

      .splash-glow {
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(14, 92, 151, 0.35) 0%, rgba(14, 92, 151, 0) 70%);
        animation: splash-glow-move 5s ease-in-out infinite;
      }

      .splash-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        animation: splash-in 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .splash-mark-wrap {
        position: relative;
        width: 88px;
        height: 88px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash-spinner {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0%, #f2971d 85%, #f2971d 100%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
        animation: splash-spin 1.1s cubic-bezier(0.65, 0.05, 0.36, 1) infinite;
      }

      .splash-mark {
        width: 58px;
        height: 58px;
        border-radius: 15px;
        background: linear-gradient(135deg, #0e5c97, #0a3d66);
        color: #fff;
        font-weight: 800;
        font-size: 23px;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(6, 26, 44, 0.5);
        animation: splash-pulse 2s ease-in-out infinite;
      }

      .splash-text {
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 2px;
        opacity: 0.92;
      }

      .splash-bar {
        width: 120px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
        margin-top: -8px;
      }

      .splash-bar-fill {
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #f2971d, transparent);
        animation: splash-bar-slide 1.3s cubic-bezier(0.65, 0.05, 0.36, 1) infinite;
      }

      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes splash-pulse {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 8px 24px rgba(6, 26, 44, 0.5), 0 0 0 0 rgba(14, 92, 151, 0.5);
        }
        50% {
          transform: scale(1.04);
          box-shadow: 0 8px 24px rgba(6, 26, 44, 0.5), 0 0 0 12px rgba(14, 92, 151, 0);
        }
      }

      @keyframes splash-glow-move {
        0%, 100% {
          transform: translate(-10%, -10%) scale(1);
        }
        50% {
          transform: translate(10%, 10%) scale(1.15);
        }
      }

      @keyframes splash-bar-slide {
        from {
          transform: translateX(-120%);
        }
        to {
          transform: translateX(300%);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="splash">
      <div class="splash-dotgrid"></div>
      <div class="splash-glow"></div>
      <div class="splash-inner">
        <div class="splash-mark-wrap">
          <div class="splash-spinner"></div>
          <div class="splash-mark">NM</div>
        </div>
        <div class="splash-text">NAMMOTORS</div>
        <div class="splash-bar"><div class="splash-bar-fill"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
